# App service for Miget Compose Stack (and local full-stack via docker-compose.local.yml).
# Database: use Miget shared/project DATABASE_URL or POSTGRES_*_URL — not defined here.

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${LOREMETRY_PORT:-8080}:${LOREMETRY_PORT:-8080}"
    environment:
      PORT: ${LOREMETRY_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DBWEI_URL: ${POSTGRES_DBWEI_URL}
      STATIC_DIR: /app/ui/dist
      RUST_LOG: ${RUST_LOG:-info}
