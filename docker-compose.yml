# App service for Miget Compose Stack (and local full-stack via docker-compose.local.yml).
# Database: set DATABASE_URL via Miget project/stack env (not in this file).

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${LOREMETRY_PORT:-8080}:${LOREMETRY_PORT:-8080}"
    environment:
      PORT: ${LOREMETRY_PORT:-8080}
      STATIC_DIR: /app/ui/dist
      RUST_LOG: ${RUST_LOG:-info}
