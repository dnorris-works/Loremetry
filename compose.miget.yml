# Miget overlay (merged with docker-compose.yml). Plain `docker compose` ignores x-miget.
# Uses the workspace shared Postgres — set DATABASE_URL / POSTGRES_DBWEI_URL on the project or stack.

services:
  web:
    x-miget:
      ram: "1024"
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"
