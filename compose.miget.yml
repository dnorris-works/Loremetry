# Miget overlay (merged with docker-compose.yml). Plain `docker compose` ignores x-miget.
# Public ingress requires the web service to listen on PORT=5000.

services:
  web:
    x-miget:
      ram: "1024"
    environment:
      PORT: "5000"
    ports:
      - "5000:5000"

  db:
    x-miget:
      managed: postgres
      cpu: "500m"
      ram: "1024"
      storage: "5120"
      private: true
