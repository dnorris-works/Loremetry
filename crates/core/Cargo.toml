[package]
name = "manuscript-intel-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Manuscript Intel — core analysis, DB, and market intel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
chrono = "0.4"
base64 = "0.21"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
proptest = "1"
