[package]
name = "loremetry-worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "loremetry-worker"
path = "src/main.rs"

[dependencies]
loremetry-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
